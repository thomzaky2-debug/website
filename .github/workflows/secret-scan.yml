name: Secret Scan & Dependency Audit
on:
  push:
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run redacted secret scan
        run: python3 scripts/secret-scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore with NuGetAudit warnings as errors
        run: dotnet restore NileShop.csproj /p:NuGetAudit=true /p:NuGetAuditMode=all /p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
      - name: Check vulnerable packages (fail on any advisory or unverified scan)
        run: |
          OUT=$(dotnet list NileShop.csproj package --vulnerable --include-transitive --format json) || { echo "Audit failed or unverified"; exit 1; }
          python3 - <<'PY' <<< "$OUT"
          import json, sys
          data = json.load(sys.stdin)
          projects = data.get("projects", [])
          if not projects:
              print("Dependency audit unverified: no projects returned.")
              sys.exit(1)
          vulns = []
          for proj in projects:
              for fw in proj.get("frameworks", []):
                  for pkg in fw.get("topLevelPackages", []) + fw.get("transitivePackages", []):
                      for v in pkg.get("vulnerabilities", []):
                          vulns.append((pkg.get("id"), pkg.get("resolvedVersion"), v.get("severity"), v.get("advisoryurl")))
          if vulns:
              for v in vulns:
                  print("VULNERABLE:", v)
              sys.exit(1)
          print("Dependency audit passed: 0 vulnerable packages.")
          PY

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Link dotnet for HTTP test harnesses
        run: |
          mkdir -p .dotnet
          ln -sf "$(which dotnet)" .dotnet/dotnet
      - name: Build application and test project
        run: |
          dotnet build NileShop.csproj --nologo
          dotnet build tests/CheckoutChecks.csproj --nologo
      - name: Run C# regression & security checks
        run: dotnet run --project tests/CheckoutChecks.csproj --no-build
      - name: Run JS HTML-escaping security check
        run: node tests/security_js.cjs
      - name: Run HTTP security, OTP, and NilePay suites
        run: |
          python3 tests/security_http.py
          python3 tests/email_otp_http.py
          python3 tests/nilepay_http.py

  sqlserver-migration-rehearsal:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "DummySqlPass!2026"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Wait for disposable SQL Server 2022 container
        run: |
          for i in $(seq 1 30); do
            if python3 -c "import socket; s=socket.create_connection(('127.0.0.1', 1433), 2); s.close()" 2>/dev/null; then
              sleep 5
              break
            fi
            sleep 2
          done
      - name: Restore dotnet-ef local tool
        run: dotnet tool restore
      - name: Run SQL Server pre-migration -> seed -> upgrade -> verify rehearsal
        env:
          STAGING_SQL_CONNECTION: "Server=127.0.0.1,1433;Database=NileShopStagingRehearsal;User Id=sa;Password=DummySqlPass!2026;TrustServerCertificate=True;Encrypt=True"
          STAGING_KEYS_PATH: /tmp/nileshop-staging-keys
          ASPNETCORE_ENVIRONMENT: Development
          Database__UseDevelopmentSqlite: "false"
          Database__ApplyMigrationsOnStartup: "false"
          Smtp__Enabled: "false"
          NilePay__Enabled: "false"
        run: |
          echo "=== Step 1: Apply pre-migration baseline (20261123202639_NotificationReadKeySize) ==="
          dotnet ef database update 20261123202639_NotificationReadKeySize --project NileShop.csproj --connection "$STAGING_SQL_CONNECTION"
          echo "=== Step 2: Seed pre-migration synthetic fixtures ==="
          dotnet run --project tests/SqlServerRehearsal/SqlServerRehearsal.csproj -- seed
          echo "=== Step 3: Apply remaining migrations (mirroring DEPLOYMENT_RUNBOOK.md) ==="
          dotnet ef database update --project NileShop.csproj --connection "$STAGING_SQL_CONNECTION"
          echo "=== Step 4: Verify preservation, startup check, dry-run, quarantine, and idempotent re-envelope ==="
          dotnet run --project tests/SqlServerRehearsal/SqlServerRehearsal.csproj -- verify
