name: Secret Scan & Dependency Audit
on:
  push:
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run redacted secret scan
        run: python3 scripts/secret-scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore with NuGetAudit warnings as errors
        run: dotnet restore NileShop.csproj /p:NuGetAudit=true /p:NuGetAuditMode=all /p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904
      - name: Check vulnerable packages (fail on any advisory or unverified scan)
        run: |
          OUT=$(dotnet list NileShop.csproj package --vulnerable --include-transitive --format json) || { echo "Audit failed or unverified"; exit 1; }
          python3 - <<'PY' <<< "$OUT"
          import json, sys
          data = json.load(sys.stdin)
          projects = data.get("projects", [])
          if not projects:
              print("Dependency audit unverified: no projects returned.")
              sys.exit(1)
          vulns = []
          for proj in projects:
              for fw in proj.get("frameworks", []):
                  for pkg in fw.get("topLevelPackages", []) + fw.get("transitivePackages", []):
                      for v in pkg.get("vulnerabilities", []):
                          vulns.append((pkg.get("id"), pkg.get("resolvedVersion"), v.get("severity"), v.get("advisoryurl")))
          if vulns:
              for v in vulns:
                  print("VULNERABLE:", v)
              sys.exit(1)
          print("Dependency audit passed: 0 vulnerable packages.")
          PY

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Link dotnet for HTTP test harnesses
        run: |
          mkdir -p .dotnet
          ln -sf "$(which dotnet)" .dotnet/dotnet
      - name: Build application and test project
        run: |
          dotnet build NileShop.csproj --nologo
          dotnet build tests/CheckoutChecks.csproj --nologo
      - name: Run C# regression & security checks
        run: dotnet run --project tests/CheckoutChecks.csproj --no-build
      - name: Run JS HTML-escaping security check
        run: node tests/security_js.cjs
      - name: Run HTTP security, OTP, and NilePay suites
        run: |
          python3 tests/security_http.py
          python3 tests/email_otp_http.py
          python3 tests/nilepay_http.py
