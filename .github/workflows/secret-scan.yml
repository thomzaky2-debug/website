name: Secret Scan & Dependency Audit
on:
  push:
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run redacted secret scan
        run: python3 scripts/secret-scan.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore with NuGetAudit warnings as errors
        run: dotnet restore /p:NuGetAudit=true /p:NuGetAuditMode=all /p:WarningsAsErrors="NU1901;NU1902;NU1903;NU1904"
      - name: Check vulnerable packages (fail on any advisory or unverified scan)
        run: |
          OUT=$(dotnet list package --vulnerable --include-transitive 2>&1) || { echo "Audit failed or unverified:"; echo "$OUT"; exit 1; }
          echo "$OUT"
          if echo "$OUT" | grep -qiE "(has the following vulnerable packages|Critical|High|Moderate|Low)"; then
            echo "Vulnerable packages detected!"
            exit 1
          fi
