name: Secret Scan
on:
  push:
  pull_request:
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run redacted secret scan
        run: python3 scripts/secret-scan.py
